name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20.9 is the Node that VS Code 1.90 — the oldest release this extension
        # declares support for — ships in its extension host. Testing only on a
        # current Node would hide APIs that are missing there, which is exactly
        # how Dirent.parentPath slipped through: it landed in 20.12.
        node: ['20.9', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Type errors and test failures are different signals, so they stay
      # separate steps: a red X points straight at the kind of breakage.
      - name: Check types
        run: npm run check-types

      - name: Run tests
        run: npm test

      - name: Bundle
        run: npm run compile

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # vsce runs vscode:prepublish itself, so this also re-checks types against
      # the exact tree being packaged. A manifest that compiles but cannot be
      # packaged — a missing icon, a bad contributes block — fails here.
      - name: Package
        run: npx --yes @vscode/vsce package --out spectra-viewer.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: spectra-viewer.vsix
          if-no-files-found: error
